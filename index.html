<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NPC Combat Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .ability-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; text-align:center; }
    .ability-grid label { font-weight:bold; font-size:0.75em; }
    .ability-grid input { width:100%; box-sizing:border-box; }
    .slot-grid { display:grid; grid-template-columns:repeat(9,1fr); gap:6px; }
    .slot-grid > div { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:0.75em; }
    .slot-grid label { font-weight:bold; color:#fff; }
    .slot-grid .slot-display { color:#fff; font-weight:bold; }
    .slot-grid button { padding:2px 6px; font-size:0.7em; border-radius:3px; background:#475569; border:none; color:#fff; cursor:pointer; }
    .slot-grid button:hover { background:#64748b; }
    .entry-list { margin:4px 0; }
    .entry-list .entry-row { display:flex; gap:4px; align-items:flex-start; margin-bottom:4px; }
    .entry-list textarea {
      flex:1;
      min-height:48px;
      resize:vertical;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    input[type="text"], input[type="number"], select, textarea { background:#1e293b !important; border:1px solid #475569 !important; border-radius:4px !important; color:#fff !important; padding:4px 6px !important; }
    input[type="text"]::placeholder, input[type="number"]::placeholder { color:#94a3b8; }
    .stat-block-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid #334155; }
    .stat-column h4 { margin:4px 0 2px; font-size:0.85em; text-transform:uppercase; color:#fff; }
    .stat-column { color:#fff; }
    .stat-column label { color:#fff; display:block; margin-bottom:2px; }
    .stat-column input, .stat-column select, .stat-column textarea { color:#fff; }
    
    #spell-modal { pointer-events: auto; }
    #spell-modal div[style*="background:#1e293b"] { pointer-events: auto; }
    #spell-modal div[style*="background:#0f172a"] { white-space: pre-wrap; word-wrap: break-word; font-family: monospace; font-size: 0.85em; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold">NPC Combat Manager</h1>
        <p class="text-slate-400 text-sm">Single-combat, local-first DM encounter tracking.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="exportBtn" class="px-3 py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-sm">Export State</button>
        <label class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm cursor-pointer">
          Import State
          <input id="importInput" type="file" accept="application/json" class="hidden" />
        </label>
        <button id="restoreBaselineBtn" class="px-3 py-2 rounded bg-amber-600 hover:bg-amber-500 text-sm">Restore Baseline</button>
      </div>
    </header>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="rounded-lg border border-slate-800 bg-slate-900 p-4 space-y-3">
        <h2 class="font-semibold">Combat Controls</h2>
        <div class="flex items-center gap-2">
          <button id="prevTurnBtn" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm">Prev Turn</button>
          <button id="nextTurnBtn" class="px-3 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm">Next Turn</button>
          <button id="newRoundBtn" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm">+ Round</button>
        </div>
        <p id="roundLabel" class="text-sm text-slate-300"></p>
        <p id="turnLabel" class="text-sm text-slate-300"></p>
      </div>

      <form id="addForm" class="rounded-lg border border-slate-800 bg-slate-900 p-4 space-y-3 lg:col-span-2">
        <h2 class="font-semibold">Add Combatant</h2>
        <div class="grid grid-cols-1 md:grid-cols-5 gap-2">
          <input name="name" required placeholder="Name" class="md:col-span-2 px-3 py-2 rounded bg-slate-800 border border-slate-700" />
          <input name="initiative" required type="number" placeholder="Init" class="px-3 py-2 rounded bg-slate-800 border border-slate-700" />
          <input name="hpMax" required type="number" placeholder="HP Max" class="px-3 py-2 rounded bg-slate-800 border border-slate-700" />
          <input name="sourceUrl" placeholder="Source URL" class="px-3 py-2 rounded bg-slate-800 border border-slate-700" />
        </div>
        <button type="submit" class="px-3 py-2 rounded bg-blue-600 hover:bg-blue-500 text-sm">Add</button>
      </form>
    </section>

    <section>
      <h2 class="font-semibold mb-2">Initiative</h2>
      <div id="list" class="space-y-3"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
